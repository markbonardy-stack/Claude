name: Build Next Player+

on:
  push:
    branches: [ nextplayer-delete ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run playlist unit tests
        run: ./gradlew :feature:playlist:testDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew :app:assembleRelease-with-debug-signing --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" | tee dist/apk-list.txt
          cp "$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)" dist/NextPlayerPlus-0.18.0-arm64-v8a.apk
          cp "$(find app/build/outputs/apk -name '*universal*.apk' | head -1)" dist/NextPlayerPlus-0.18.0-universal.apk
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          {
            echo "Built from commit $GITHUB_SHA"
            for f in dist/*.apk; do
              echo
              echo "== $(basename "$f")"
              ls -la "$f"
              sha256sum "$f"
              "$AAPT2" dump badging "$f" | grep -E "^package|application-label:|^sdkVersion|^targetSdkVersion|^native-code"
              "$APKSIGNER" verify --print-certs "$f" | head -3
            done
          } > dist/BUILD-INFO.txt
          cat dist/BUILD-INFO.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=nextplayer-plus-0.18.0-delete
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" dist/*.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Next Player+ 0.18.0 (playlist Delete + no screenshots)" \
            --notes-file dist/BUILD-INFO.txt

      - name: Push APKs to nextplayer-delete-apk branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/apkbranch && cp dist/* /tmp/apkbranch/ && cd /tmp/apkbranch
          git init -q -b nextplayer-delete-apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Next Player+ APKs built from $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" nextplayer-delete-apk

      - name: Push diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/diag && cd /tmp/diag
          find "$GITHUB_WORKSPACE/app/build/outputs" -maxdepth 4 > outputs.txt 2>&1 || true
          cp -r "$GITHUB_WORKSPACE/feature/playlist/build/test-results" . 2>/dev/null || true
          git init -q -b nextplayer-delete-diag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Diagnostics for $GITHUB_SHA" --allow-empty
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" nextplayer-delete-diag

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports'
